name: .NET CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Restore, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/HelloDotnet.Tests.csproj

      - name: Build
        run: dotnet build tests/HelloDotnet.Tests.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test tests/HelloDotnet.Tests.csproj --no-build --configuration Release --verbosity normal

  build-linux:
    name: Publish Linux x64
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained single-file app
        run: dotnet publish src/HelloDotnet.csproj --configuration Release --runtime linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Package Linux artifact
        run: tar -czf hello-dotnet-linux-x64.tar.gz -C publish hello-dotnet
      - uses: actions/upload-artifact@v4
        with:
          name: hello-dotnet-linux-x64
          path: hello-dotnet-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Publish Windows x64
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained single-file app
        run: dotnet publish src/HelloDotnet.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Package Windows artifact
        shell: pwsh
        run: Compress-Archive -Path publish/hello-dotnet.exe -DestinationPath hello-dotnet-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hello-dotnet-windows-x64
          path: hello-dotnet-windows-x64.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
